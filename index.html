<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>VantaCast — медиахостинг</title>
<style>
:root{color-scheme:light dark;--bg:light-dark(#f5f7fb,#090b10);--panel:light-dark(#fff,#11151d);--panel2:light-dark(#f0f3f8,#171c25);--text:light-dark(#10131a,#f5f7fb);--muted:light-dark(#687181,#9ca6b6);--line:light-dark(#dfe4ec,#252c38);--blue:#1677ff;--red:#ff3154;--black:#080a0f;--white:#fff;--shadow:0 18px 50px rgba(0,0,0,.12)}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input{font:inherit}.app{min-height:100vh;background:var(--bg)}.topbar{height:72px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:24px;padding:0 28px;position:sticky;top:0;background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(18px);z-index:20}.brand{display:flex;align-items:center;gap:10px;font-weight:900;font-size:21px;letter-spacing:-.04em;min-width:185px}.brandmark{width:31px;height:31px;border-radius:9px;background:linear-gradient(135deg,var(--blue) 0 49%,var(--red) 50%);position:relative;box-shadow:8px 7px 0 #0a0d12}.brandmark:after{content:"";position:absolute;width:8px;height:8px;background:#fff;border-radius:50%;top:6px;right:6px}.search{flex:1;max-width:590px;position:relative}.search input{width:100%;height:42px;border:1px solid var(--line);background:var(--panel);border-radius:12px;padding:0 16px 0 42px;color:var(--text);outline:none}.search span{position:absolute;left:15px;top:10px;color:var(--muted)}.top-actions{margin-left:auto;display:flex;gap:10px;align-items:center}.btn{border:1px solid var(--line);background:var(--panel);color:var(--text);height:40px;padding:0 14px;border-radius:10px;cursor:pointer;font-weight:700}.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}.btn.danger{background:var(--red);border-color:var(--red);color:#fff}.avatar{width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,#111827,#ef233c);display:grid;place-items:center;color:#fff;font-weight:800}.layout{display:grid;grid-template-columns:230px 1fr;min-height:calc(100vh - 72px)}aside{border-right:1px solid var(--line);padding:22px 14px;position:sticky;top:72px;height:calc(100vh - 72px)}.nav-label{font-size:11px;text-transform:uppercase;color:var(--muted);font-weight:800;letter-spacing:.12em;padding:0 12px 9px}.nav{display:grid;gap:5px}.nav button{border:0;background:transparent;color:var(--muted);text-align:left;padding:11px 12px;border-radius:10px;cursor:pointer;font-weight:700}.nav button:hover,.nav button.active{background:var(--panel2);color:var(--text)}.nav button.active{box-shadow:inset 3px 0 var(--blue)}.side-bottom{position:absolute;bottom:18px;left:14px;right:14px;border:1px solid var(--line);background:var(--panel);border-radius:13px;padding:14px}.side-bottom strong{font-size:13px}.side-bottom p{font-size:11px;color:var(--muted);line-height:1.4}.main{padding:28px;max-width:1450px;width:100%;margin:auto}.hero{border:1px solid var(--line);border-radius:22px;background:linear-gradient(120deg,#0a0e16 0 48%,#101b32 48% 72%,#310b16 72%);color:#fff;min-height:245px;padding:34px;display:flex;align-items:end;justify-content:space-between;overflow:hidden;position:relative}.hero:before{content:"LIVE";position:absolute;right:-10px;top:8px;font-size:160px;font-weight:1000;color:rgba(255,255,255,.035);letter-spacing:-.1em}.hero h1{font-size:42px;letter-spacing:-.06em;margin:0 0 9px}.hero p{color:#b8c1d1;max-width:560px;margin:0 0 22px}.hero-actions{display:flex;gap:10px}.section-head{display:flex;align-items:center;justify-content:space-between;margin:30px 0 15px}.section-head h2{margin:0;font-size:21px;letter-spacing:-.03em}.muted{color:var(--muted)}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}.card{border:1px solid var(--line);background:var(--panel);border-radius:15px;overflow:hidden;cursor:pointer;transition:.18s}.card:hover{transform:translateY(-2px);box-shadow:var(--shadow)}.thumb{height:145px;background:linear-gradient(135deg,#111722,#263b66);position:relative;display:flex;align-items:flex-end;padding:12px}.thumb.red{background:linear-gradient(135deg,#210b12,#8c1830)}.thumb.mix{background:linear-gradient(135deg,#10131b 0 50%,#123a72 50% 70%,#721328 70%)}.thumb.blue{background:linear-gradient(135deg,#06172d,#1777ff)}.live{background:var(--red);color:#fff;border-radius:5px;padding:4px 7px;font-size:10px;font-weight:900}.duration{margin-left:auto;background:rgba(0,0,0,.65);color:#fff;padding:4px 6px;border-radius:5px;font-size:10px}.card-body{padding:12px}.card-title{font-weight:800;font-size:14px;line-height:1.3;margin-bottom:6px}.card-meta{font-size:11px;color:var(--muted);display:flex;justify-content:space-between}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:18px}.stat{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px}.stat b{font-size:25px}.stat span{display:block;font-size:11px;color:var(--muted);margin-top:5px}.admin{display:none}.admin.active{display:block}.dashboard-grid{display:grid;grid-template-columns:1.5fr 1fr;gap:16px}.panel{background:var(--panel);border:1px solid var(--line);border-radius:15px;padding:18px}.panel h3{margin:0 0 15px}.table{width:100%;border-collapse:collapse;font-size:13px}.table th,.table td{padding:12px 8px;border-bottom:1px solid var(--line);text-align:left}.table th{color:var(--muted);font-size:10px;text-transform:uppercase;letter-spacing:.08em}.tag{font-size:10px;font-weight:800;padding:5px 7px;border-radius:6px;background:var(--panel2)}.tag.ok{color:#20a15a}.tag.warn{color:#d47b00}.bar{height:9px;background:var(--panel2);border-radius:99px;overflow:hidden;margin:8px 0 13px}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--blue),var(--red));border-radius:99px}.modal{display:none;position:fixed;inset:0;background:rgba(3,5,9,.7);z-index:50;align-items:center;justify-content:center;padding:20px}.modal.open{display:flex}.modalbox{width:min(600px,100%);background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:22px;box-shadow:var(--shadow)}.modalbox h2{margin-top:0}.drop{border:1px dashed #68758a;border-radius:13px;padding:34px;text-align:center;background:var(--panel2);margin:15px 0}.drop strong{display:block;margin-bottom:6px}.formrow{display:grid;gap:7px;margin:12px 0}.formrow label{font-size:12px;font-weight:800}.formrow input{height:42px;border:1px solid var(--line);background:var(--panel2);border-radius:9px;padding:0 12px;color:var(--text)}.modal-actions{display:flex;justify-content:flex-end;gap:9px;margin-top:18px}@media(max-width:1000px){.cards{grid-template-columns:repeat(2,1fr)}.layout{grid-template-columns:75px 1fr}aside{padding:18px 10px}.nav-label,.nav button span,.side-bottom{display:none}.nav button{text-align:center}.brand{min-width:auto}.brand em{display:none}.dashboard-grid{grid-template-columns:1fr}}@media(max-width:650px){.topbar{padding:0 14px}.search{display:none}.main{padding:16px}.hero{padding:23px;min-height:270px}.hero h1{font-size:32px}.cards,.stats{grid-template-columns:1fr}.layout{grid-template-columns:1fr}aside{display:none}.top-actions .btn:not(.primary){display:none}.table{font-size:11px}}
</style>
</head>
<body><div class="app"><header class="topbar"><div class="brand"><div class="brandmark"></div><span>VantaCast</span></div><div class="search"><span>⌕</span><input placeholder="Поиск по VantaCast…" oninput="searchRoute(this.value)"></div><div class="top-actions"><button class="btn" onclick="openUpload()">＋ Загрузить</button><button class="btn" onclick="openAuth()" id="authBtn">Войти</button><button class="btn primary" onclick="openAdmin()">Админ-панель</button><div class="avatar" id="avatar">VC</div></div></header><div class="layout"><aside><div class="nav-label">Навигация</div><nav class="nav"><button data-route="/" onclick="go('/')">⌂ <span>Главная</span></button><button data-route="/tv" onclick="go('/tv')">▣ <span>ТВ</span></button><button data-route="/live" onclick="go('/live')">◉ <span>Эфиры</span></button><button data-route="/videos" onclick="go('/videos')">▶ <span>Видео</span></button><button data-route="/radio" onclick="go('/radio')">◒ <span>Радио</span></button><button data-route="/podcasts" onclick="go('/podcasts')">◌ <span>Подкасты</span></button><button data-route="/library" onclick="go('/library')">▣ <span>Моя медиатека</span></button></nav><div class="nav-label" style="margin-top:25px">Аккаунт</div><nav class="nav"><button data-route="/settings" onclick="go('/settings')">⚙ <span>Настройки</span></button><button data-route="/help" onclick="go('/help')">◌ <span>Помощь</span></button></nav><div class="side-bottom"><strong>VantaCast</strong><p>Публичный медиахостинг без демо-контента.</p><button class="btn primary" style="width:100%" onclick="openAuth()">Создать профиль</button></div></aside><main class="main"><section id="page"></section></main></div><div class="modal" id="modal"><div class="modalbox" id="modalBox"></div></div></div><script>
const routes={"/":['Главная','Добавляйте собственный контент в VantaCast. Здесь будут отображаться только реальные публикации пользователей.'],"/tv":['ТВ','Здесь появятся ваши добавленные телеканалы.'],"/live":['Эфиры','Здесь появятся ваши реальные прямые эфиры.'],"/videos":['Видео','Здесь будут храниться загруженные пользователями видео.'],"/radio":['Радио','Здесь будут ваши радиостанции и аудиопотоки.'],"/podcasts":['Подкасты','Здесь будут опубликованные пользователями подкасты.'],"/library":['Моя медиатека','Войдите, чтобы увидеть свою медиатеку.'],"/settings":['Настройки','Управление профилем и параметрами аккаунта.'],"/help":['Помощь','Документация и поддержка VantaCast.']};
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}function currentUser(){return JSON.parse(localStorage.getItem('vc_user')||'null')}function go(path){history.pushState({},'',path);render(path)}window.onpopstate=()=>render(location.pathname);function render(path=location.pathname){const r=routes[path]||routes['/'];document.querySelectorAll('[data-route]').forEach(b=>b.classList.toggle('active',b.dataset.route===path));const u=currentUser();document.getElementById('page').innerHTML=`<div class="hero"><div><div class="live" style="display:inline-block;margin-bottom:12px">VANTACAST</div><h1>${r[0]}</h1><p>${r[1]}</p><div class="hero-actions"><button class="btn primary" onclick="openUpload()">Загрузить медиа</button>${u?'<button class="btn" onclick="logout()">Выйти</button>':'<button class="btn" onclick="openAuth()">Войти / регистрация</button>'}</div></div></div><div class="panel" style="margin-top:18px"><h3>Контент отсутствует</h3><p class="muted">Мы не добавляем выдуманные ролики, каналы или статистику. После подключения хранилища здесь будут реальные данные.</p></div>`;document.getElementById('authBtn').textContent=u?'Выйти':'Войти';document.getElementById('avatar').textContent=u?(u.email[0]||'U').toUpperCase():'VC'}
function openAuth(){document.getElementById('modalBox').innerHTML=`<h2>VantaCast аккаунт</h2><p class="muted">Регистрация и вход выполняются только по email и паролю. Подтверждение email не требуется.</p><div class="formrow"><label>Email</label><input id="email" type="email" autocomplete="email" placeholder="you@example.com"></div><div class="formrow"><label>Пароль</label><input id="password" type="password" autocomplete="current-password" placeholder="••••••••"></div><div class="modal-actions"><button class="btn" onclick="closeModal()">Отмена</button><button class="btn primary" onclick="registerOrLogin()">Войти / создать профиль</button></div>`;document.getElementById('modal').classList.add('open')}function registerOrLogin(){const email=document.getElementById('email').value.trim().toLowerCase(),password=document.getElementById('password').value;if(!email||!password)return alert('Введите email и пароль.');const users=JSON.parse(localStorage.getItem('vc_users')||'{}');if(users[email]&&users[email]!==password)return alert('Пароль не совпадает.');users[email]=password;localStorage.setItem('vc_users',JSON.stringify(users));localStorage.setItem('vc_user',JSON.stringify({email}));closeModal();render(location.pathname)}function logout(){localStorage.removeItem('vc_user');render(location.pathname)}function openUpload(){if(!currentUser())return openAuth();document.getElementById('modalBox').innerHTML=`<h2>Загрузка медиа</h2><div class="drop"><strong>Выберите файл</strong><span class="muted">MP4, WebM, MP3, WAV и другие форматы.</span><input id="file" type="file" style="margin-top:18px;width:100%"></div><div class="formrow"><label>Название</label><input id="title" placeholder="Название публикации"></div><div class="formrow"><label>Описание</label><input id="desc" placeholder="Описание"></div><div class="modal-actions"><button class="btn" onclick="closeModal()">Отмена</button><button class="btn primary" onclick="saveMedia()">Добавить</button></div>`;document.getElementById('modal').classList.add('open')}function saveMedia(){const f=document.getElementById('file').files[0],title=document.getElementById('title').value.trim();if(!f||!title)return alert('Выберите файл и укажите название.');const media=JSON.parse(localStorage.getItem('vc_media')||'[]');media.push({title,file:f.name,email:currentUser().email,created:new Date().toISOString()});localStorage.setItem('vc_media',JSON.stringify(media));closeModal();alert('Запись добавлена в локальную очередь интерфейса. Для реального хранилища подключим backend.')}function closeModal(){document.getElementById('modal').classList.remove('open')}function searchRoute(q){if(q.trim())go('/videos')}function openAdmin(){document.getElementById('page').innerHTML=`<div class="section-head" style="margin-top:0"><div><div class="muted" style="font-size:12px">CONTROL CENTER</div><h2 style="font-size:30px">Админ-панель</h2></div><button class="btn" onclick="go('/')">← Сайт</button></div><div class="dashboard-grid"><div class="panel"><h3>Медиа</h3><p class="muted">Реальные загрузки появятся после подключения backend-хранилища.</p><button class="btn" onclick="go('/videos')">Открыть видео</button></div><div class="panel"><h3>Пользователи</h3><p class="muted">Профили создаются по email + пароль без email-подтверждения.</p></div><div class="panel"><h3>Модерация</h3><p class="muted">Очередь жалоб пока пуста.</p></div><div class="panel"><h3>Хранилище</h3><p class="muted">Лимиты будут показаны после подключения объектного storage.</p></div></div>`}render();
</script>
</body></html>
